<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>松雀 - Mahjong Score</title>
    
    <!-- PWA & iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="松雀">
    
    <!-- 強制読み込み用バージョン付きアイコン設定 -->
    <link rel="apple-touch-icon" href="icon.png?v=104">
    <link rel="icon" href="icon.png?v=104">

    <style>
        :root {
            --primary: #004d40; /* 深緑 */
            --accent: #d4af37;  /* ゴールド */
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --danger: #cf6679;
            --success: #03dac6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding-bottom: 50px;
            line-height: 1.6;
        }

        /* Header & Icon */
        header {
            background-color: var(--primary);
            padding: 16px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .logo-img {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent); letter-spacing: 2px; }

        .container { max-width: 600px; margin: 0 auto; padding: 15px; }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h2 { font-size: 1.1rem; margin-top: 0; border-left: 4px solid var(--accent); padding-left: 10px; }

        /* Forms */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #bbb; }
        select, input {
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
        }
        select { width: 100%; }

        /* スコア入力用コンテナ (00点固定表示用) */
        .score-input-wrap {
            display: flex;
            align-items: center;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            padding-right: 10px;
        }
        .score-input-wrap input {
            border: none;
            background: transparent;
            width: 100%;
            text-align: right;
            padding-right: 4px;
        }
        .score-input-wrap input:focus {
            outline: none;
        }
        .score-unit {
            color: var(--accent);
            font-weight: bold;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .btn {
            background: var(--primary);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:active { opacity: 0.7; }
        .btn-outline { background: transparent; color: #bbb; border-color: #444; margin-top: 10px; }
        .btn-danger { color: var(--danger); border-color: var(--danger); }

        /* Members List */
        .member-tag {
            display: inline-block;
            background: #333;
            padding: 5px 12px;
            border-radius: 20px;
            margin: 0 5px 5px 0;
            font-size: 0.9rem;
        }
        .member-count {
            font-size: 0.75rem;
            color: var(--accent);
            margin-left: 4px;
        }
        .remove-btn { color: var(--danger); margin-left: 8px; cursor: pointer; }

        /* Score Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #333; }
        th { color: var(--accent); }
        .pos-pt { color: var(--success); }
        .neg-pt { color: var(--danger); }

        /* Grid for Point Input */
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-item { background: #252525; padding: 10px; border-radius: 8px; }

        /* Rule Config Inputs */
        .rule-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        
        /* ウマのレイアウト */
        .uma-wrapper {
            display: grid;
            gap: 8px;
            margin-top: 6px;
        }
        .uma-wrapper.uma-4 {
            grid-template-columns: repeat(2, 1fr);
        }
        .uma-wrapper.uma-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        .uma-box {
            display: flex;
            align-items: center;
            background: #282828;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 4px 8px;
        }
        .uma-label {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: bold;
            width: 32px;
            flex-shrink: 0;
        }
        .uma-box input {
            border: none;
            background: transparent;
            padding: 4px;
            text-align: right;
            width: 100%;
            font-size: 0.95rem;
        }
        .uma-box input:focus {
            outline: none;
        }

        /* History Accordion */
        .history-item {
            border-bottom: 1px solid #333;
            padding: 12px 0;
            cursor: pointer;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-info { font-size: 0.8rem; color: #999; }
        .history-scores { font-size: 0.9rem; font-weight: bold; margin-top: 4px; }
        .history-details {
            display: none;
            margin-top: 10px;
            background: #282828;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .history-details.open { display: block; }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px dashed #444;
        }
        .detail-row:last-child { border-bottom: none; }

    </style>
</head>
<body>

<header>
    <img src="icon.png?v=104" class="logo-img" alt="logo" onerror="this.style.display='none'">
    <h1>松雀</h1>
</header>

<div class="container">
    
    <!-- 1. メンバー管理 -->
    <section class="card">
        <h2>メンバー管理</h2>
        <div id="memberList" style="margin-bottom: 15px;"></div>
        <div class="form-group" style="display: flex; gap: 10px;">
            <input type="text" id="newMemberName" placeholder="名前を入力" style="width:100%;">
            <button class="btn" style="width: 80px;" onclick="addMember()">追加</button>
        </div>
    </section>

    <!-- 2. ルール設定 -->
    <section class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>対局設定</h2>
            <select id="gameMode" style="width: auto;" onchange="changeMode()">
                <option value="4">四人麻雀</option>
                <option value="3">三人麻雀</option>
            </select>
        </div>
        
        <div class="rule-grid">
            <div>
                <label>配給原点</label>
                <div class="score-input-wrap">
                    <input type="number" id="ruleStart" onchange="updateRuleCustom()">
                    <span class="score-unit">00点</span>
                </div>
            </div>
            <div>
                <label>返し点</label>
                <div class="score-input-wrap">
                    <input type="number" id="ruleReturn" onchange="updateRuleCustom()">
                    <span class="score-unit">00点</span>
                </div>
            </div>
        </div>

        <div style="margin-top: 12px;">
            <label>ウマ設定 (pt)</label>
            <div id="umaContainer"></div>
        </div>
    </section>

    <!-- 3. スコア入力 -->
    <section class="card">
        <h2>スコア入力 <span style="font-size:0.75rem; font-weight:normal; color:#aaa;">(例: 250 ➔ 25,000点)</span></h2>
        <div id="scoreInputs" class="grid-inputs">
            <!-- JSで動的に生成 -->
        </div>
        <div style="margin-top: 15px;">
            <div id="totalPointsDisplay" style="text-align: right; font-size: 0.9rem; margin-bottom: 10px;">
                合計: <span id="currentTotalPoints">0</span> / <span id="targetTotalPoints">100,000</span> 点
            </div>
            <button class="btn" onclick="saveGame()">この試合を保存する</button>
        </div>
    </section>

    <!-- 4. トータル成績 -->
    <section class="card">
        <h2>トータル成績</h2>
        <div style="overflow-x: auto;">
            <table id="statsTable">
                <thead>
                    <tr>
                        <th>名前</th>
                        <th>参加数</th>
                        <th>参加率</th>
                        <th>累計pt</th>
                        <th>平均順位</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <!-- 5. 履歴 -->
    <section class="card">
        <h2>対局履歴 <span style="font-size:0.75rem; font-weight:normal; color:#aaa;">(タップで点数表示)</span></h2>
        <div id="historyList"></div>
        <button class="btn btn-outline btn-danger" onclick="resetAllData()">全データをリセット</button>
    </section>

</div>

<script>
    const SEATS = ['東家', '南家', '西家', '北家'];

    let state = {
        members: [], 
        history: [], 
        mode: 4,     
        rules: {
            4: { start: 250, return: 300, uma: [30, 10, -10, -30] },
            3: { start: 350, return: 400, uma: [20, 0, -20] }
        }
    };

    function loadData() {
        const saved = localStorage.getItem('mahjong_data');
        if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.rules) state.rules = parsed.rules;
            if (parsed.members) state.members = parsed.members;
            if (parsed.history) state.history = parsed.history;
            if (parsed.mode) state.mode = parsed.mode;
        }
        document.getElementById('gameMode').value = state.mode;
        renderAll();
    }

    function saveData() {
        localStorage.setItem('mahjong_data', JSON.stringify(state));
        renderAll();
    }

    function addMember() {
        const input = document.getElementById('newMemberName');
        const name = input.value.trim();
        if (!name) return;
        state.members.push({ id: Date.now(), name: name });
        input.value = '';
        saveData();
    }

    function removeMember(id) {
        if (!confirm('このメンバーを削除しますか？（成績データは残ります）')) return;
        state.members = state.members.filter(m => m.id !== id);
        saveData();
    }

    function changeMode() {
        state.mode = parseInt(document.getElementById('gameMode').value);
        saveData();
    }

    function updateRuleCustom() {
        const mode = state.mode;
        const start = parseInt(document.getElementById('ruleStart').value) || 0;
        const ret = parseInt(document.getElementById('ruleReturn').value) || 0;
        
        let uma = [];
        for (let i = 0; i < mode; i++) {
            const val = parseFloat(document.getElementById(`uma-${i}`).value) || 0;
            uma.push(val);
        }

        state.rules[mode] = { start: start, return: ret, uma: uma };
        saveData();
    }

    function syncRuleUI() {
        const rule = state.rules[state.mode];
        document.getElementById('ruleStart').value = rule.start;
        document.getElementById('ruleReturn').value = rule.return;

        const umaContainer = document.getElementById('umaContainer');
        umaContainer.className = `uma-wrapper uma-${state.mode}`;
        
        let html = '';
        for (let i = 0; i < state.mode; i++) {
            html += `
                <div class="uma-box">
                    <span class="uma-label">${i + 1}位</span>
                    <input type="number" id="uma-${i}" value="${rule.uma[i] !== undefined ? rule.uma[i] : 0}" onchange="updateRuleCustom()">
                </div>
            `;
        }
        umaContainer.innerHTML = html;

        document.getElementById('targetTotalPoints').innerText = (rule.start * 100 * state.mode).toLocaleString();
    }

    function renderScoreInputs() {
        const container = document.getElementById('scoreInputs');
        
        const currentSelections = [];
        const currentScores = [];
        for (let i = 0; i < state.mode; i++) {
            const sel = document.getElementById(`p-name-${i}`);
            const sc = document.getElementById(`p-score-${i}`);
            currentSelections.push(sel ? sel.value : '');
            currentScores.push(sc ? sc.value : '');
        }

        container.innerHTML = '';
        
        for (let i = 0; i < state.mode; i++) {
            const div = document.createElement('div');
            div.className = 'input-item';
            
            let options = state.members.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
            if (state.members.length === 0) options = '<option value="">(メンバー未登録)</option>';

            div.innerHTML = `
                <label>${SEATS[i]}</label>
                <select class="p-name" id="p-name-${i}" style="margin-bottom:8px;">${options}</select>
                <div class="score-input-wrap">
                    <input type="number" class="p-score" id="p-score-${i}" placeholder="持ち点" value="${currentScores[i] || ''}" oninput="calcCurrentTotal()">
                    <span class="score-unit">00点</span>
                </div>
            `;
            container.appendChild(div);
        }

        for (let i = 0; i < state.mode; i++) {
            const sel = document.getElementById(`p-name-${i}`);
            if (currentSelections[i] && Array.from(sel.options).some(o => o.value === currentSelections[i])) {
                sel.value = currentSelections[i];
            } else if (sel.options[i]) {
                sel.selectedIndex = i;
            }
        }
        calcCurrentTotal();
    }

    function calcCurrentTotal() {
        const scores = document.querySelectorAll('.p-score');
        let sum = 0;
        scores.forEach(s => sum += ((parseInt(s.value) || 0) * 100));
        document.getElementById('currentTotalPoints').innerText = sum.toLocaleString();
        
        const target = state.rules[state.mode].start * 100 * state.mode;
        document.getElementById('currentTotalPoints').style.color = (sum === target) ? 'var(--success)' : 'var(--danger)';
    }

    function saveGame() {
        const rule = state.rules[state.mode];
        const realStart = rule.start * 100;
        const realReturn = rule.return * 100;

        let players = [];
        let totalInputScore = 0;

        for (let i = 0; i < state.mode; i++) {
            const name = document.getElementById(`p-name-${i}`).value;
            const inputScore = parseInt(document.getElementById(`p-score-${i}`).value);
            if (!name || isNaN(inputScore)) {
                alert('全員の名前とスコアを正しく入力してください');
                return;
            }
            const realScore = inputScore * 100;
            players.push({ name, score: realScore });
            totalInputScore += realScore;
        }

        if (totalInputScore !== realStart * state.mode) {
            if (!confirm(`点数合計が合いません（現在:${totalInputScore.toLocaleString()}点）。このまま保存しますか？`)) return;
        }

        players.sort((a, b) => b.score - a.score);

        let gameResults = [];
        let ptSum = 0;

        players.forEach((p, index) => {
            let basePt = (p.score - realReturn) / 1000;
            let pt = basePt + rule.uma[index];
            gameResults.push({ name: p.name, score: p.score, pt: pt, rank: index + 1 });
            if (index !== 0) ptSum += pt;
        });

        gameResults[0].pt = Math.round((0 - ptSum) * 10) / 10;

        const historyItem = {
            id: Date.now(),
            date: new Date().toLocaleString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
            mode: state.mode,
            results: gameResults
        };

        state.history.unshift(historyItem);
        saveData();
        alert('保存しました');
        
        document.querySelectorAll('.p-score').forEach(input => input.value = '');
        calcCurrentTotal();
    }

    function toggleDetails(id, event) {
        if(event.target.classList.contains('remove-btn')) return;
        const el = document.getElementById(`details-${id}`);
        if(el) {
            el.classList.toggle('open');
        }
    }

    function deleteHistory(id) {
        if (!confirm('この対局結果を削除しますか？')) return;
        state.history = state.history.filter(h => h.id !== id);
        saveData();
    }

    function resetAllData() {
        if (!confirm('全てのデータ（メンバー・履歴）を削除しますか？')) return;
        localStorage.removeItem('mahjong_data');
        location.reload();
    }

    function renderAll() {
        // 全体の総対局数
        const totalGamesCount = state.history.length;

        // 各メンバーの参加数を集計
        const stats = {};
        state.history.forEach(h => {
            h.results.forEach(r => {
                if (!stats[r.name]) stats[r.name] = { count: 0, pt: 0, rankSum: 0 };
                stats[r.name].count++;
                stats[r.name].pt += r.pt;
                stats[r.name].rankSum += r.rank;
            });
        });

        // メンバー管理リストの描画
        const mList = document.getElementById('memberList');
        mList.innerHTML = state.members.map(m => {
            const memberCount = stats[m.name] ? stats[m.name].count : 0;
            return `
                <span class="member-tag">
                    ${m.name}<span class="member-count">(${memberCount}試合)</span>
                    <span class="remove-btn" onclick="removeMember(${m.id})">×</span>
                </span>
            `;
        }).join('');

        syncRuleUI();
        renderScoreInputs();

        // トータル成績テーブルの描画
        const statsBody = document.querySelector('#statsTable tbody');
        const sortedStats = Object.keys(stats).sort((a, b) => stats[b].pt - stats[a].pt);
        
        statsBody.innerHTML = sortedStats.map(name => {
            const s = stats[name];
            const rate = totalGamesCount > 0 ? ((s.count / totalGamesCount) * 100).toFixed(0) : 0;
            return `
                <tr>
                    <td>${name}</td>
                    <td>${s.count} / ${totalGamesCount}</td>
                    <td>${rate}%</td>
                    <td class="${s.pt >= 0 ? 'pos-pt' : 'neg-pt'}">${s.pt.toFixed(1)}</td>
                    <td>${(s.rankSum / s.count).toFixed(2)}</td>
                </tr>
            `;
        }).join('');

        // 対局履歴の描画
        const hList = document.getElementById('historyList');
        hList.innerHTML = state.history.map(h => `
            <div class="history-item" onclick="toggleDetails(${h.id}, event)">
                <div class="history-header">
                    <div>
                        <div class="history-info">${h.date} (${h.mode}人麻雀)</div>
                        <div class="history-scores">
                            ${h.results.map(r => `${r.name}(${r.pt > 0 ? '+' : ''}${r.pt})`).join(' ')}
                        </div>
                    </div>
                    <div class="remove-btn" onclick="deleteHistory(${h.id})">削除</div>
                </div>
                <div class="history-details" id="details-${h.id}">
                    <div style="font-weight:bold; margin-bottom:5px; color:var(--accent);">持ち点内訳:</div>
                    ${h.results.map(r => `
                        <div class="detail-row">
                            <span>${r.rank}位: ${r.name}</span>
                            <span>${r.score !== undefined ? r.score.toLocaleString() + ' 点' : '記録なし'} (${r.pt > 0 ? '+' : ''}${r.pt}pt)</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    window.onload = () => {
        loadData();
    };
</script>

</body>
</html>
